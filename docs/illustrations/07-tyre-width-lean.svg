<svg xmlns="http://www.w3.org/2000/svg" width="760" height="624" viewBox="0 0 380 312" role="img">
<title>Why a wide tyre makes the bike lean further</title>
<desc>Rear view of a leaned tyre in a right-hand corner. The contact point P sits directly below the centre C of the tyre's round cross-section, at a distance t. The centre of gravity G lies in the wheel plane, h minus t from C. The road force runs from P to G and leans at phi zero; the wheel plane leans further, at phi. In triangle P, C, G the law of sines gives phi = phi zero + asin(t sin phi zero / (h - t)). Schematic: the tyre width is exaggerated.</desc>
<style>
svg{--bg:#ffffff;--text-primary:#1f1e1d;--text-secondary:#5f5e5a;--text-muted:#888780;--surface-1:#f1efe8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#1c1c1a;--text-primary:#ecebe6;--text-secondary:#b4b2a9;--surface-1:#2c2c2a}}
.t{font-size:14px;font-weight:400;fill:var(--text-primary)}
.ts{font-size:12px;font-weight:400;fill:var(--text-secondary)}
.th{font-size:14px;font-weight:500;fill:var(--text-primary)}
.tb{font-size:13px;font-weight:600;fill:var(--text-primary)}
</style>
<defs>
<marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="380" height="312" fill="var(--bg)"/>
<text class="th" x="190" y="24" text-anchor="middle">φ = φ₀ + asin( t·sin φ₀ ÷ (h − t) )</text>
<text class="ts" x="190" y="44" text-anchor="middle">P moves inside, so the wheel leans further than the force line</text>
<!-- ground and vertical reference through P and C -->
<line x1="20" y1="260" x2="360" y2="260" stroke="var(--text-secondary)" stroke-width="1"/>
<line x1="150" y1="260" x2="150" y2="62" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="2 3"/>
<!-- wheel plane (bike), leaning at phi = 37.7 degrees about the crown centre C -->
<line x1="125.6" y1="251.7" x2="266.1" y2="69.6" stroke="#B4B2A9" stroke-width="9" stroke-linecap="round"/>
<!-- tyre cross-section of radius t around C -->
<circle cx="150" cy="220" r="40" fill="none" stroke="#5F5E5A" stroke-width="2"/>
<!-- t: from P up to C -->
<line x1="150" y1="260" x2="150" y2="220" stroke="var(--text-primary)" stroke-width="1.5"/>
<!-- road force from P through G, at phi0 = 30 degrees -->
<line x1="150" y1="260" x2="233.4" y2="115.5" stroke="#534AB7" stroke-width="2.5" marker-end="url(#a-purple)"/>
<line x1="233.4" y1="115.5" x2="241.6" y2="101.2" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="4 3"/>
<!-- vertical through G, for the alternate angle phi0 -->
<line x1="241.6" y1="101.2" x2="241.6" y2="150" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="2 3"/>
<!-- angle phi at C, between the vertical and the wheel plane -->
<path d="M150 168 A52 52 0 0 1 181.8 178.8" fill="none" stroke="var(--text-secondary)" stroke-width="1"/>
<text class="tb" x="166" y="160">φ</text>
<!-- angle phi0 at G, between the vertical and the line to P -->
<path d="M241.6 135.2 A34 34 0 0 1 224.6 130.7" fill="none" stroke="#534AB7" stroke-width="1"/>
<text class="tb" x="246" y="152" style="fill:#534AB7">φ₀</text>
<!-- points -->
<circle cx="150" cy="260" r="3.5" fill="var(--text-primary)"/>
<circle cx="150" cy="220" r="3.5" fill="var(--text-primary)"/>
<circle cx="241.6" cy="101.2" r="6" fill="#534AB7"/>
<text class="tb" x="141" y="279" text-anchor="middle">P</text>
<text class="tb" x="136" y="216" text-anchor="end">C</text>
<text class="tb" x="252" y="98">G</text>
<text class="ts" x="146" y="246" text-anchor="end">t</text>
<text class="ts" x="212" y="130" text-anchor="end">h − t</text>
<!-- legend -->
<text class="ts" x="232" y="206">P  contact point</text>
<text class="ts" x="232" y="224">C  tyre-section centre</text>
<text class="ts" x="232" y="242">G  centre of gravity</text>
<text class="ts" x="360" y="282" text-anchor="end">turn centre →</text>
<text class="ts" x="20" y="302">Schematic: tyre width exaggerated.</text>
</svg>
