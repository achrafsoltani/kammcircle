<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 380 290" role="img">
<title>Body position on tarmac versus gravel</title>
<desc>Rear view of two riders in the same right-hand corner. On tarmac the rider sits and leans with the bike, so the bike leans less (25 degrees). On gravel the rider stands upright with weight on the outside peg, so the bike leans more underneath (40 degrees). The combined centre of gravity sits on the same total-lean line in both. Angles are illustrative.</desc>
<style>
svg{--bg:#ffffff;--text-primary:#1f1e1d;--text-secondary:#5f5e5a;--text-muted:#888780;--surface-1:#f1efe8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#1c1c1a;--text-primary:#ecebe6;--text-secondary:#b4b2a9;--surface-1:#2c2c2a}}
.t{font-size:14px;font-weight:400;fill:var(--text-primary)}
.ts{font-size:12px;font-weight:400;fill:var(--text-secondary)}
.th{font-size:14px;font-weight:500;fill:var(--text-primary)}
</style>
<rect width="380" height="290" fill="var(--bg)"/>
<line x1="40" y1="24" x2="64" y2="24" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3"/>
<text class="ts" x="70" y="28">same total lean</text>
<circle cx="200" cy="24" r="4" fill="#1D9E75"/>
<text class="ts" x="210" y="28">rider + bike CoG</text>
<line x1="20" y1="230" x2="360" y2="230" stroke="var(--text-secondary)" stroke-width="1"/>
<line x1="95" y1="230" x2="155" y2="126" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="95" y1="230" x2="137.3" y2="139.4" stroke="#888780" stroke-width="10" stroke-linecap="round"/>
<line x1="114.6" y1="128.8" x2="160" y2="150" stroke="var(--text-primary)" stroke-width="3" stroke-linecap="round"/>
<line x1="96.8" y1="197.7" x2="118.6" y2="207.9" stroke="var(--text-primary)" stroke-width="3" stroke-linecap="round"/>
<line x1="124.6" y1="166.6" x2="156.7" y2="128.3" stroke="var(--text-primary)" stroke-width="3" stroke-linecap="round"/>
<circle cx="165.7" cy="117.6" r="9" fill="none" stroke="var(--text-primary)" stroke-width="2"/>
<polyline points="156.7,128.3 114.6,128.8" fill="none" stroke="var(--text-primary)" stroke-width="2"/>
<polyline points="156.7,128.3 160,150" fill="none" stroke="var(--text-primary)" stroke-width="2"/>
<polyline points="124.6,166.6 140,190 118.6,207.9" fill="none" stroke="var(--text-primary)" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="127.3" cy="174" r="5" fill="#1D9E75"/>
<text class="ts" x="30" y="215">bike 25°</text>
<line x1="285" y1="230" x2="345" y2="126" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="285" y1="230" x2="349.3" y2="153.4" stroke="#888780" stroke-width="10" stroke-linecap="round"/>
<line x1="330.1" y1="137.3" x2="368.5" y2="169.5" stroke="var(--text-primary)" stroke-width="3" stroke-linecap="round"/>
<line x1="295.1" y1="199.3" x2="313.5" y2="214.7" stroke="var(--text-primary)" stroke-width="3" stroke-linecap="round"/>
<polyline points="295.1,199.3 290,172 302,145" fill="none" stroke="var(--text-primary)" stroke-width="3" stroke-linejoin="round"/>
<polyline points="313.5,214.7 315,176 302,145" fill="none" stroke="var(--text-primary)" stroke-width="2" stroke-linejoin="round"/>
<line x1="302" y1="145" x2="314.4" y2="98.6" stroke="var(--text-primary)" stroke-width="3" stroke-linecap="round"/>
<circle cx="318" cy="85.1" r="9" fill="none" stroke="var(--text-primary)" stroke-width="2"/>
<polyline points="314.4,98.6 330.1,137.3" fill="none" stroke="var(--text-primary)" stroke-width="2"/>
<polyline points="314.4,98.6 368.5,169.5" fill="none" stroke="var(--text-primary)" stroke-width="2"/>
<circle cx="316.8" cy="175" r="5" fill="#1D9E75"/>
<text class="ts" x="215" y="215">bike 40°</text>
<text class="ts" x="95" y="256" text-anchor="middle">Tarmac: sit, lean with</text>
<text class="ts" x="95" y="272" text-anchor="middle">the bike, inside peg</text>
<text class="ts" x="285" y="256" text-anchor="middle">Gravel: stand, bike leans</text>
<text class="ts" x="285" y="272" text-anchor="middle">under you, outside peg</text>
</svg>
