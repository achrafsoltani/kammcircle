<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 380 320" role="img">
<title>Forces on a leaning motorcycle</title>
<desc>Rear view of a bike leaned 35 degrees in a right-hand corner. Gravity mg acts down through the combined centre of gravity. The road pushes up with the normal force N (teal) and sideways with grip force F (coral) toward the turn centre. Their sum (purple) points along the lean line through the centre of gravity, so tan theta = F / N = v squared / (g r). The tyre slides when tan theta exceeds mu.</desc>
<style>
svg{--bg:#ffffff;--text-primary:#1f1e1d;--text-secondary:#5f5e5a;--text-muted:#888780;--surface-1:#f1efe8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#1c1c1a;--text-primary:#ecebe6;--text-secondary:#b4b2a9;--surface-1:#2c2c2a}}
.t{font-size:14px;font-weight:400;fill:var(--text-primary)}
.ts{font-size:12px;font-weight:400;fill:var(--text-secondary)}
.th{font-size:14px;font-weight:500;fill:var(--text-primary)}
</style>
<defs>
<marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a-text" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--text-primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="380" height="320" fill="var(--bg)"/>
<text class="th" x="190" y="26" text-anchor="middle">tan θ = F ÷ N = v² ÷ (g·r)</text>
<text class="ts" x="190" y="46" text-anchor="middle">grip holds while tan θ ≤ μ, slides when tan θ &gt; μ</text>
<line x1="20" y1="280" x2="360" y2="280" stroke="var(--text-secondary)" stroke-width="1"/>
<g transform="rotate(35 150 280)">
<rect x="144" y="120" width="12" height="110" rx="6" fill="#B4B2A9"/>
<rect x="139" y="212" width="22" height="68" rx="11" fill="#5F5E5A"/>
</g>
<line x1="150" y1="190" x2="213" y2="190" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="213" y1="280" x2="213" y2="190" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="150" y1="280" x2="150" y2="192" stroke="#1D9E75" stroke-width="2.5" marker-end="url(#a-teal)"/>
<line x1="150" y1="280" x2="211" y2="280" stroke="#D85A30" stroke-width="2.5" marker-end="url(#a-coral)"/>
<line x1="150" y1="280" x2="212" y2="191.5" stroke="#534AB7" stroke-width="2.5" marker-end="url(#a-purple)"/>
<line x1="213" y1="190" x2="236" y2="157" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="236" y1="157" x2="236" y2="247" stroke="var(--text-primary)" stroke-width="2" marker-end="url(#a-text)"/>
<circle cx="236" cy="157" r="6" fill="#534AB7"/>
<path d="M150 240 A40 40 0 0 1 172.9 247.2" fill="none" stroke="var(--text-secondary)" stroke-width="1"/>
<text class="ts" x="155" y="234">θ</text>
<text class="ts" x="142" y="206" text-anchor="end">N (road pushes up)</text>
<text class="ts" x="200" y="180" text-anchor="end">total road force</text>
<text class="ts" x="256" y="162">rider + bike CoG</text>
<text class="ts" x="244" y="222">mg</text>
<text class="ts" x="182" y="300" text-anchor="middle">F = grip force = mv² ÷ r</text>
<text class="ts" x="360" y="272" text-anchor="end">turn centre →</text>
</svg>
