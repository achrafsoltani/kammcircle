<svg xmlns="http://www.w3.org/2000/svg" width="760" height="700" viewBox="0 0 380 350" role="img">
<title>Late-apex line through a right-hand bend</title>
<desc>Top-down view of one lane turning right. Purple: late-apex line with braking zone (coral), late turn-in (coral dot) and late apex (purple dot). Grey dashed: early-apex line that runs wide out of the lane at the exit.</desc>
<style>
svg{--bg:#ffffff;--text-primary:#1f1e1d;--text-secondary:#5f5e5a;--text-muted:#888780;--surface-1:#f1efe8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#1c1c1a;--text-primary:#ecebe6;--text-secondary:#b4b2a9;--surface-1:#2c2c2a}}
.t{font-size:14px;font-weight:400;fill:var(--text-primary)}
.ts{font-size:12px;font-weight:400;fill:var(--text-secondary)}
.th{font-size:14px;font-weight:500;fill:var(--text-primary)}
.leader{stroke:var(--text-muted);stroke-width:.75;stroke-dasharray:3 3;fill:none}
</style>
<defs>
<marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="380" height="350" fill="var(--bg)"/>
<path d="M120 340 L120 200 A130 130 0 0 1 250 70 L365 70" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M190 340 L190 200 A60 60 0 0 1 250 140 L365 140" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M136 340 L136 260 C136 215 165 182 190 178 C240 170 305 115 345 48" fill="none" stroke="#888780" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a-gray)"/>
<path d="M128 340 L128 205 C128 165 170 145 214 144 C256 141 315 102 352 84" fill="none" stroke="#534AB7" stroke-width="3" marker-end="url(#a-purple)"/>
<line x1="128" y1="300" x2="128" y2="240" stroke="#D85A30" stroke-width="7" stroke-linecap="round"/>
<circle cx="128" cy="205" r="5" fill="#D85A30"/>
<circle cx="214" cy="144" r="5" fill="#534AB7"/>
<text class="ts" x="365" y="30" text-anchor="end">Early apex: runs wide</text>
<text class="ts" x="14" y="200">Turn in late:</text>
<text class="ts" x="14" y="216">push right grip</text>
<line class="leader" x1="112" y1="206" x2="121" y2="206"/>
<text class="ts" x="14" y="262">Brake upright,</text>
<text class="ts" x="14" y="278">pick your gear</text>
<line class="leader" x1="106" y1="270" x2="122" y2="270"/>
<text class="ts" x="226" y="182">Late apex,</text>
<text class="ts" x="226" y="198">steady throttle</text>
<line class="leader" x1="222" y1="171" x2="216" y2="152"/>
<text class="ts" x="226" y="252">Eyes to exit early,</text>
<text class="ts" x="226" y="268">roll on after apex</text>
<line class="leader" x1="356" y1="238" x2="338" y2="99"/>
</svg>
