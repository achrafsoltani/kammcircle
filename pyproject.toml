[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kammcircle"
version = "0.1.0"
description = "Desktop motorcycle simulator: lean, grip and the friction circle, rider position, steering geometry and lowering, on sourced bike data."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Achraf Soltani" }]
keywords = ["motorcycle", "physics", "simulation", "friction circle", "steering geometry", "PySide6"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["PySide6-Essentials>=6.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
kammcircle = "kammcircle.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kammcircle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
