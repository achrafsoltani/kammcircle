[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kammcircle"
version = "0.10.0"
description = "Desktop motorcycle simulator built on Kamm's circle: time-stepped braking, acceleration, countersteering and tyre warm-up, and steady turns on Magic Formula tyres, on sourced bike data."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Achraf Soltani" }]
keywords = ["motorcycle", "motorcycle dynamics", "vehicle dynamics", "physics", "simulation", "friction circle",
            "Magic Formula", "tyre model", "countersteering", "steering geometry", "PySide6"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["PySide6-Essentials>=6.8"]

[project.urls]
Homepage = "https://github.com/achrafsoltani/kammcircle"
Documentation = "https://github.com/achrafsoltani/kammcircle/blob/main/docs/physics.md"
Source = "https://github.com/achrafsoltani/kammcircle"
Issues = "https://github.com/achrafsoltani/kammcircle/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
kammcircle = "kammcircle.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kammcircle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: end-to-end tests that drive the real window through the Qt event loop"]
